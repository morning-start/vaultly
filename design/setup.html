<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="dsh-design" content="app">
<title>创建保险库</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<style>
  body {
    background: var(--color-bg-deep);
    display: flex; flex-direction: column; min-height: 100vh;
    opacity: 0; transition: opacity 400ms var(--ease);
  }
  .setup-main {
    flex: 1; width: 100%; max-width: 420px; margin: 0 auto;
    display: flex; flex-direction: column; align-items: stretch;
    padding: 12px 28px 32px;
  }
  .dial { position: relative; width: 96px; height: 96px; margin: 16px auto 0; }
  .dial-ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1px dashed oklch(50% 0.02 275 / 0.7);
    animation: dial-breathe 4s ease-in-out infinite;
  }
  .dial-core {
    position: absolute; inset: 12px; border-radius: 50%;
    background: var(--color-surface);
    border: 1px solid var(--color-line-strong);
    display: grid; place-items: center;
    color: var(--color-primary);
  }
  .setup-title { font-size: var(--text-xl); font-weight: 700; text-align: center; margin: 22px 0 0; letter-spacing: -0.01em; }
  .setup-lead { font-size: var(--text-sm); color: var(--color-muted); text-align: center; line-height: 1.65; margin: 8px 0 0; }
  .setup-form { display: flex; flex-direction: column; gap: 14px; margin-top: 26px; }
  .setup-form .field-label { margin: 0 0 8px; }
  .check-list { display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; }
  .check-item { display: flex; align-items: center; gap: 9px; font-size: var(--text-sm); color: var(--color-muted); }
  .check-item svg { color: var(--color-accent); flex: none; }
  .warn-card {
    display: flex; gap: 12px; padding: 14px 16px;
    border-radius: var(--radius-lg);
    border: 1px solid color-mix(in oklab, var(--color-warning) 32%, transparent);
    background: color-mix(in oklab, var(--color-warning) 9%, transparent);
  }
  .warn-card svg { color: var(--color-warning); flex: none; margin-top: 1px; }
  .warn-card b { display: block; font-size: var(--text-sm); font-weight: 600; }
  .warn-card p { font-size: var(--text-xs); color: var(--color-muted); line-height: 1.65; margin: 3px 0 0; }
  .back-link {
    margin-top: auto; padding-top: 26px; align-self: center;
    font-size: var(--text-sm); color: var(--color-muted);
    text-decoration: underline; text-underline-offset: 4px;
    text-decoration-color: var(--color-line-strong);
    transition: color var(--dur) var(--ease);
  }
  .back-link:hover { color: var(--color-text); }
</style>
</head>
<body>

  <header class="statusbar">
    <span>9:41</span>
    <span class="status-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7.5" width="3" height="4.5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity="0.35"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4.5a10.5 10.5 0 0 1 14 0"/><path d="M4 7.3a7 7 0 0 1 9 0"/><path d="M6.6 10a3.4 3.4 0 0 1 3.8 0"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity="0.4"/></svg>
    </span>
  </header>

  <main class="setup-main">
    <div class="dial" aria-hidden="true">
      <span class="dial-ring"></span>
      <span class="dial-core">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
      </span>
    </div>

    <h1 class="setup-title">创建你的保险库</h1>
    <p class="setup-lead">主密码是打开保险库的唯一钥匙，<br>之后的所有数据都由它加密。</p>

    <form class="setup-form" onsubmit="return false">
      <div>
        <div class="field-label">主密码</div>
        <div class="input">
          <input class="mono" type="password" value="T9vLmQx8pW4z!2" autocomplete="new-password" aria-label="主密码">
          <button class="icon-btn sm" type="button" id="eye" aria-label="显示主密码" style="margin-right:-6px">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="strength">
          <span class="bar"><i style="width:92%"></i></span>
          <span class="txt">非常强</span>
        </div>
      </div>

      <div class="card check-list">
        <div class="check-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
          至少 12 个字符
        </div>
        <div class="check-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
          包含大小写字母与数字
        </div>
        <div class="check-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
          包含符号
        </div>
        <div class="check-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
          未出现在常见泄露库中
        </div>
      </div>

      <div class="warn-card">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        <div>
          <b>主密码无法找回</b>
          <p>Vaultly 不存储你的主密码，也没有任何后门。请务必牢记，或把恢复密钥保存在安全的地方。</p>
        </div>
      </div>

      <div>
        <div class="field-label">确认主密码</div>
        <div class="input">
          <input class="mono" type="password" placeholder="再次输入主密码" autocomplete="new-password" aria-label="确认主密码">
        </div>
      </div>

      <a class="btn btn-primary" href="vault.html" style="margin-top:4px">创建保险库</a>
    </form>

    <a class="back-link" href="unlock.html">已有保险库？返回解锁</a>
  </main>

  <p class="footer-note" style="padding-bottom:24px">Vaultly 1.2.0 · AES-256-GCM · 纯本地加密</p>

  <script>
    requestAnimationFrame(() => { document.body.style.opacity = '1'; });
    const eye = document.getElementById('eye');
    const mp = eye.closest('.input').querySelector('input');
    eye.addEventListener('click', () => {
      const show = mp.type === 'password';
      mp.type = show ? 'text' : 'password';
      eye.setAttribute('aria-label', show ? '隐藏主密码' : '显示主密码');
    });
  </script>

</body>
</html>
