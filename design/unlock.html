<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="dsh-design" content="app">
<title>解锁保险库</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<style>
  body { background: var(--color-bg-deep); }

  /* 表盘呼吸微光 —— 全页唯一的装饰，极低透明度 */
  .dial-glow {
    position: absolute; left: 50%; top: 176px;
    width: 300px; height: 300px;
    transform: translateX(-50%);
    background: radial-gradient(circle, oklch(71% 0.125 277 / 0.12) 0%, transparent 62%);
    animation: dial-breathe 5s var(--ease) infinite;
    pointer-events: none;
  }

  .unlock-wrap {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    padding: 34px 32px 0;
  }

  /* 保险库表盘徽记：刻度环 + 内环 + 盾牌 */
  .dial { position: relative; width: 128px; height: 128px; }
  .dial .ticks { position: absolute; inset: 0; color: var(--color-line-strong); animation: dial-breathe 5s var(--ease) infinite; }
  .dial .core {
    position: absolute; inset: 17px;
    border-radius: 50%;
    background: var(--color-surface);
    border: 1px solid var(--color-line-strong);
    display: flex; align-items: center; justify-content: center;
    color: var(--color-primary);
    box-shadow: 0 6px 24px oklch(0% 0 0 / 0.35);
  }

  h1 { font-size: var(--text-xl); font-weight: 700; letter-spacing: -0.01em; margin: 28px 0 6px; }
  .lead { font-size: var(--text-sm); color: var(--color-muted); margin: 0 0 32px; }

  .form { width: 100%; display: flex; flex-direction: column; gap: 12px; }

  .or-row {
    display: flex; align-items: center; gap: 14px;
    color: var(--color-muted); font-size: var(--text-xs);
    margin: 8px 0;
  }
  .or-row::before, .or-row::after { content: ""; flex: 1; height: 1px; background: var(--color-line); }

  .bio-btn {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 1px solid var(--color-line-strong);
    background: var(--color-surface);
    color: var(--color-primary);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform var(--dur) var(--ease), background var(--dur) var(--ease);
  }
  .bio-btn:hover { background: var(--color-surface-2); }
  .bio-btn:active { transform: scale(0.94); }
  .bio-label { font-size: var(--text-xs); color: var(--color-muted); margin-top: 10px; }
  .first-link {
    margin-top: 28px;
    font-size: var(--text-sm); color: var(--color-muted);
    text-decoration: underline; text-underline-offset: 4px;
    text-decoration-color: var(--color-line-strong);
    transition: color var(--dur) var(--ease);
  }
  .first-link:hover { color: var(--color-text); }

  .foot {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 16px 40px 34px;
  }
</style>
</head>
<body>

  <header class="statusbar">
    <span>9:41</span>
    <span class="status-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7.5" width="3" height="4.5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity="0.35"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4.5a10.5 10.5 0 0 1 14 0"/><path d="M4 7.3a7 7 0 0 1 9 0"/><path d="M6.6 10a3.4 3.4 0 0 1 3.8 0"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity="0.4"/></svg>
    </span>
  </header>

  <div class="dial-glow"></div>

  <main class="unlock-wrap">
    <!-- 保险库表盘：记忆点 -->
    <div class="dial" aria-hidden="true">
      <svg class="ticks" viewBox="0 0 128 128">
        <circle cx="64" cy="64" r="61" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="2 7.4"/>
        <circle cx="64" cy="64" r="50" fill="none" stroke="currentColor" stroke-width="1" opacity="0.6"/>
      </svg>
      <div class="core">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
          <circle cx="12" cy="11" r="1.6"/>
          <path d="M12 12.6V15"/>
        </svg>
      </div>
    </div>

    <h1>欢迎回来</h1>
    <p class="lead">输入主密码，打开你的保险库</p>

    <form class="form" onsubmit="return false">
      <div class="field-label" style="margin-top:0"><span>主密码</span></div>
      <label class="input">
        <span class="l-ico">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input type="password" placeholder="••••••••••••••" autocomplete="current-password">
        <button type="button" class="icon-btn sm" aria-label="显示密码">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </label>

      <a class="btn btn-primary" href="vault.html" style="margin-top:4px">
        解锁保险库
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </a>
    </form>

    <div class="or-row">或者</div>

    <a href="vault.html" style="display:flex;flex-direction:column;align-items:center">
      <span class="bio-btn">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12C2 6.5 6.5 2 12 2a10 10 0 0 1 8 4"/><path d="M5 19.5C5.5 18 6 15 6 12c0-.7.12-1.37.34-2"/><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M8.65 22c.21-.66.45-1.32.57-2"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M9 6.8a6 6 0 0 1 9 5.2c0 .47 0 1.17-.02 2"/>
        </svg>
      </span>
      <span class="bio-label">生物识别解锁</span>
    </a>

    <a class="first-link" href="setup.html">首次使用？创建新的保险库</a>
  </main>

  <footer class="foot footer-note">
    Vaultly v1.2.0 · AES-256-GCM 本地加密<br>
    忘记密码？<a href="#recover">使用恢复密钥重置</a>
  </footer>

</body>
</html>
