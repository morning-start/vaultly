<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="dsh-design" content="app">
<title>设置</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<style>
  /* 保险库状态卡 —— 本屏焦点 */
  .vault-card {
    display: flex; align-items: center; gap: 14px;
    padding: 18px 16px;
    background: linear-gradient(150deg, var(--color-primary-soft), transparent 55%), var(--color-surface);
    border: 1px solid color-mix(in oklab, var(--color-primary) 26%, transparent);
    border-radius: var(--radius-lg);
  }
  .vault-card h2 { font-size: var(--text-md); font-weight: 600; margin: 0 0 3px; }
  .vault-card p { font-size: 13px; color: var(--color-muted); margin: 0; line-height: 1.5; }

  .row-tight { min-height: 56px; }
  .row-tight .row-title { font-size: var(--text-md); font-weight: 400; }
  .row-value { font-size: var(--text-sm); color: var(--color-muted); display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>

  <header class="statusbar">
    <span>9:41</span>
    <span class="status-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7.5" width="3" height="4.5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity="0.35"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4.5a10.5 10.5 0 0 1 14 0"/><path d="M4 7.3a7 7 0 0 1 9 0"/><path d="M6.6 10a3.4 3.4 0 0 1 3.8 0"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity="0.4"/></svg>
    </span>
  </header>

  <main class="page" style="padding-bottom:130px">

    <h1 class="big-title" style="margin-top:10px">设置</h1>

    <!-- 保险库状态 -->
    <div class="vault-card">
      <span class="icon-badge lg t-primary" style="flex:none">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
      </span>
      <div style="flex:1;min-width:0">
        <h2>保险库已加密</h2>
        <p>AES-256-GCM · Argon2id 派生<br>24 个条目 · 2.4 MB</p>
      </div>
      <span class="pill ok">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        已同步
      </span>
    </div>

    <div class="section-label">安全</div>
    <div class="card">
      <div class="row row-tight">
        <span class="row-title">自动锁定</span>
        <span class="row-value" style="margin-left:auto">离开后 1 分钟</span>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <div class="row row-tight">
        <span class="row-title">生物识别解锁</span>
        <label class="switch" style="margin-left:auto"><input type="checkbox" checked aria-label="生物识别解锁"><span class="track"></span></label>
      </div>
      <div class="row row-tight">
        <span class="row-title">剪贴板自动清理</span>
        <span class="row-value" style="margin-left:auto">30 秒</span>
        <label class="switch" style="margin-left:10px"><input type="checkbox" checked aria-label="剪贴板自动清理"><span class="track"></span></label>
      </div>
      <a class="row row-tight" href="setup.html">
        <span class="row-title">修改主密码</span>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto"><path d="m9 18 6-6-6-6"/></svg>
      </a>
    </div>

    <div class="section-label">同步</div>
    <div class="card">
      <a class="row row-tight" href="sync.html">
        <span class="row-title">WebDAV 同步</span>
        <span class="row-value" style="margin-left:auto">nas.local:5006</span>
        <span class="pill ok">已启用</span>
      </a>
      <div class="row row-tight">
        <span class="row-title">立即同步</span>
        <span class="row-value" style="margin-left:auto">2 分钟前</span>
        <button class="icon-btn sm" aria-label="立即同步" data-toast="正在连接 nas.local…">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
      </div>
      <div class="row row-tight">
        <span class="row-title">冲突时</span>
        <span class="row-value" style="margin-left:auto">保留较新版本</span>
      </div>
    </div>

    <div class="section-label">外观</div>
    <div class="card">
      <div class="row row-tight">
        <span class="row-title">主题</span>
        <span class="row-value" style="margin-left:auto">深色</span>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <div class="row row-tight">
        <span class="row-title">隐藏截图中的敏感信息</span>
        <label class="switch" style="margin-left:auto"><input type="checkbox" checked aria-label="隐藏截屏中的敏感信息"><span class="track"></span></label>
      </div>
    </div>

    <div class="section-label">数据</div>
    <div class="card">
      <div class="row row-tight">
        <span class="row-title">导出加密备份</span>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <div class="row row-tight">
        <span class="row-title">从备份导入</span>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto"><path d="m9 18 6-6-6-6"/></svg>
      </div>
    </div>

    <div class="section-label">关于</div>
    <div class="card">
      <div class="row row-tight">
        <span class="row-title">版本</span>
        <span class="row-value mono" style="margin-left:auto">1.2.0 (326)</span>
      </div>
      <div class="row row-tight">
        <span class="row-title">开源许可</span>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <div class="row row-tight">
        <span class="row-title">帮助与反馈</span>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:auto"><path d="m9 18 6-6-6-6"/></svg>
      </div>
    </div>

    <p class="footer-note" style="margin:28px 0 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-faint)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:0 auto 8px"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
      Vaultly · 数据只属于你<br>本地加密存储，永不上传第三方服务器
    </p>

  </main>

  <!-- 标签栏 -->
  <nav class="tabbar" aria-label="主导航">
    <a class="tab" href="vault.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
      保险库
    </a>
    <a class="tab" href="vault.html#fav">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11.53 2.3a.53.53 0 0 1 .94 0l2.31 4.67a2.12 2.12 0 0 0 1.6 1.16l5.16.76a.53.53 0 0 1 .3.9l-3.74 3.64a2.12 2.12 0 0 0-.61 1.88l.88 5.14a.53.53 0 0 1-.77.56l-4.62-2.43a2.12 2.12 0 0 0-1.97 0l-4.62 2.43a.53.53 0 0 1-.77-.56l.88-5.14a2.12 2.12 0 0 0-.61-1.88L2.16 9.8a.53.53 0 0 1 .3-.91l5.16-.75a2.12 2.12 0 0 0 1.6-1.16z"/></svg>
      收藏
    </a>
    <a class="tab" href="tools.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
      工具
    </a>
    <a class="tab active" href="settings.html" aria-current="page">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      设置
    </a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    <span>已完成</span>
  </div>
  <script>
    const toast = document.getElementById('toast');
    const toastMsg = toast.querySelector('span');
    let hideTimer;
    document.querySelectorAll('[data-toast]').forEach(btn =>
      btn.addEventListener('click', () => {
        toastMsg.textContent = btn.dataset.toast;
        toast.classList.add('show');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => toast.classList.remove('show'), 2000);
      }));
  </script>

</body>
</html>
