<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="dsh-design" content="app">
<title>添加条目</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<style>
  /* 类型选择：四宫格 */
  .type-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .type-cell {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 12px 4px 10px;
    border-radius: var(--radius-md);
    border: 1px solid var(--color-line);
    background: var(--color-surface);
    color: var(--color-muted);
    font-size: 12px; font-weight: 500;
    cursor: pointer;
    transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .type-cell:hover { background: var(--color-surface-2); }
  .type-cell.active {
    border-color: color-mix(in oklab, var(--color-primary) 45%, transparent);
    background: var(--color-primary-soft);
    color: var(--color-text);
  }
  .type-cell.active .icon-badge { color: var(--color-primary); background: color-mix(in oklab, var(--color-primary) 20%, transparent); }

  .gen-link {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: var(--text-sm); font-weight: 500; color: var(--color-primary);
    margin: -10px 0; padding: 10px 0 10px 4px;
    border: none; background: none; cursor: pointer;
  }
  .gen-link:active { opacity: 0.6; }

  /* 生成器弹层内的密码展示 */
  .gen-display {
    display: flex; align-items: center; gap: 8px;
    padding: 16px;
    border-radius: var(--radius-md);
    background: var(--color-bg);
    border: 1px solid var(--color-line-strong);
  }
  .gen-display .pw {
    flex: 1;
    font-family: var(--font-mono);
    font-size: var(--text-lg); font-weight: 600; line-height: 1.4;
    letter-spacing: 0.03em;
    word-break: break-all;
  }
  .gen-row { display: flex; align-items: center; gap: 14px; padding: 13px 0; font-size: var(--text-md); }
  .gen-row + .gen-row { border-top: 1px solid var(--color-line); }
  .gen-row .val { margin-left: auto; color: var(--color-muted); font-variant-numeric: tabular-nums; }
  .len-num { font-family: var(--font-mono); font-size: var(--text-lg); font-weight: 600; color: var(--color-primary); width: 36px; text-align: right; }
  .len-slider { display: flex; align-items: center; gap: 14px; padding: 6px 0 16px; }
</style>
</head>
<body>

  <header class="statusbar">
    <span>9:41</span>
    <span class="status-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7.5" width="3" height="4.5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity="0.35"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4.5a10.5 10.5 0 0 1 14 0"/><path d="M4 7.3a7 7 0 0 1 9 0"/><path d="M6.6 10a3.4 3.4 0 0 1 3.8 0"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity="0.4"/></svg>
    </span>
  </header>

  <!-- 顶栏：取消 / 标题 / 保存 -->
  <div class="navbar" style="position:relative">
    <div class="nav-side">
      <a class="nav-text-btn" style="color:var(--color-muted)" href="vault.html">取消</a>
    </div>
    <span class="nav-title">添加条目</span>
    <div class="nav-side right">
      <a class="nav-text-btn" href="vault.html">保存</a>
    </div>
  </div>

  <main class="page" style="padding-bottom:110px">

    <!-- 条目类型 -->
    <div class="section-label" style="margin-top:8px">条目类型</div>
    <div class="type-grid" role="radiogroup" aria-label="条目类型">
      <button class="type-cell active" aria-checked="true">
        <span class="icon-badge t-login" style="width:40px;height:40px;border-radius:12px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.78 7.78 5.5 5.5 0 0 1 7.78-7.78zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
        </span>
        登录凭证
      </button>
      <button class="type-cell">
        <span class="icon-badge t-card" style="width:40px;height:40px;border-radius:12px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><path d="M2 10h20"/></svg>
        </span>
        银行卡
      </button>
      <button class="type-cell">
        <span class="icon-badge t-note" style="width:40px;height:40px;border-radius:12px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
        </span>
        安全笔记
      </button>
      <button class="type-cell">
        <span class="icon-badge t-identity" style="width:40px;height:40px;border-radius:12px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></svg>
        </span>
        身份信息
      </button>
    </div>

    <!-- 表单 -->
    <div class="field-label"><span>名称</span></div>
    <label class="input"><input type="text" value="GitHub" placeholder="例如：GitHub"></label>

    <div class="field-label"><span>用户名 / 邮箱</span></div>
    <label class="input">
      <input type="text" value="hanes.dev@gmail.com" placeholder="用户名或邮箱">
    </label>

    <div class="field-label">
      <span>密码</span>
      <button class="gen-link" type="button" data-open-gen style="margin-top:0">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72"/><path d="m14 7 3 3"/><path d="M5 6v4"/><path d="M19 14v4"/><path d="M10 2v2"/><path d="M7 8H3"/><path d="M21 16h-4"/><path d="M11 3H9"/></svg>
        生成器
      </button>
    </div>
    <label class="input">
      <input class="mono" type="text" value="T9$vLm#2Qx!8pW4z">
      <button type="button" class="icon-btn sm" aria-label="重新生成密码">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
      <button type="button" class="icon-btn sm" aria-label="显示密码">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </label>
    <div class="strength">
      <span class="bar"><i style="width:88%"></i></span>
      <span class="txt">非常强 · 88/100</span>
    </div>

    <div class="field-label"><span>网址</span></div>
    <label class="input">
      <span class="l-ico">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
      </span>
      <input type="url" value="https://github.com" placeholder="https://example.com">
    </label>

    <div class="field-label">
      <span>两步验证密钥（TOTP）</span>
    </div>
    <label class="input">
      <input class="mono" type="text" value="JBSW Y3DP EHPK 3PXP" placeholder="Base32 密钥">
      <button type="button" class="icon-btn sm" aria-label="扫描二维码">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></svg>
      </button>
    </label>

    <div class="section-label">整理</div>
    <div class="card">
      <div class="row clickable" style="cursor:pointer">
        <span class="icon-badge t-primary" style="width:36px;height:36px;border-radius:10px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
        </span>
        <span class="row-main">
          <span class="row-title" style="font-size:var(--text-sm);font-weight:500">文件夹</span>
        </span>
        <span class="row-end" style="font-size:14px;color:var(--color-muted)">开发</span>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <div class="row clickable" style="cursor:pointer;min-height:72px">
        <span class="icon-badge t-primary" style="width:36px;height:36px;border-radius:10px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12.59 2.59A2 2 0 0 0 11.17 2H4a2 2 0 0 0-2 2v7.17a2 2 0 0 0 .59 1.42l8.7 8.7a2.43 2.43 0 0 0 3.42 0l6.58-6.58a2.43 2.43 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r="0.5" fill="currentColor"/></svg>
        </span>
        <span class="row-main">
          <span class="row-title" style="font-size:var(--text-sm);font-weight:500">标签</span>
          <span class="row-sub" style="margin-top:6px">代码 · 常用</span>
        </span>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>
    </div>

  </main>

  <!-- 保存 -->
  <div class="action-bar">
    <a class="btn btn-primary" href="vault.html">保存条目</a>
  </div>

  <!-- ============ 密码生成器 · 底部弹层 ============ -->
  <section class="sheet" id="gen-sheet" role="dialog" aria-modal="true" aria-label="密码生成器">
    <div class="sheet-grabber"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <h2 style="font-size:var(--text-lg);font-weight:700;margin:0">密码生成器</h2>
      <button class="icon-btn" data-close-gen aria-label="关闭">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <div class="gen-display">
      <span class="pw">T9$vLm#2Qx!8pW4z</span>
      <button class="icon-btn sm" aria-label="复制密码" style="color:var(--color-text)">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
      </button>
      <button class="icon-btn sm" aria-label="重新生成" style="color:var(--color-text)">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
      </button>
    </div>
    <div class="strength" style="margin:10px 2px 18px">
      <span class="bar"><i style="width:92%"></i></span>
      <span class="txt">非常强 · 92/100</span>
    </div>

    <div class="len-slider">
      <span style="font-size:14px;color:var(--color-muted);flex:none">长度</span>
      <input class="slider" type="range" min="8" max="64" value="16" aria-label="密码长度">
      <span class="len-num">16</span>
    </div>

    <div class="gen-row">大写字母 (A–Z) <label class="switch" style="margin-left:auto"><input type="checkbox" checked><span class="track"></span></label></div>
    <div class="gen-row">小写字母 (a–z) <label class="switch" style="margin-left:auto"><input type="checkbox" checked><span class="track"></span></label></div>
    <div class="gen-row">数字 (0–9) <label class="switch" style="margin-left:auto"><input type="checkbox" checked><span class="track"></span></label></div>
    <div class="gen-row">符号 (!@#…) <label class="switch" style="margin-left:auto"><input type="checkbox" checked><span class="track"></span></label></div>
    <div class="gen-row" style="gap:12px">
      <span>
        易读模式<br>
        <span style="font-size:12px;color:var(--color-muted)">排除 0O1lI 等易混淆字符</span>
      </span>
      <label class="switch" style="margin-left:auto"><input type="checkbox"><span class="track"></span></label>
    </div>

    <div style="display:flex;gap:12px;margin-top:18px">
      <button class="btn btn-ghost" data-close-gen style="flex:1">关闭</button>
      <button class="btn btn-primary" data-close-gen style="flex:2">使用此密码</button>
    </div>
  </section>
  <div class="sheet-backdrop" id="gen-backdrop" data-close-gen></div>

  <script>
    const sheet = document.getElementById('gen-sheet');
    const backdrop = document.getElementById('gen-backdrop');
    const open = () => { sheet.classList.add('open'); backdrop.classList.add('open'); };
    const close = () => { sheet.classList.remove('open'); backdrop.classList.remove('open'); };
    document.querySelectorAll('[data-open-gen]').forEach(el => el.addEventListener('click', open));
    document.querySelectorAll('[data-close-gen]').forEach(el => el.addEventListener('click', close));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  </script>

</body>
</html>
