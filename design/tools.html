<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="dsh-design" content="app">
<title>工具</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<style>
  .gen-card { padding: 16px; }
  .gen-display {
    display: flex; align-items: center; gap: 4px;
    padding: 12px 6px 12px 14px;
    border-radius: var(--radius-md);
    background: var(--color-bg-deep);
    border: 1px solid var(--color-line);
  }
  .gen-pw {
    flex: 1; min-width: 0;
    font-family: var(--font-mono); font-size: 15px; font-weight: 500;
    letter-spacing: 0.02em; word-break: break-all; line-height: 1.5;
  }
  .len-row { display: flex; align-items: center; gap: 12px; padding: 14px 2px 10px; }
  .len-row .lbl { font-size: var(--text-sm); color: var(--color-muted); flex: none; }
  .len-num {
    width: 40px; text-align: center; flex: none;
    font-variant-numeric: tabular-nums;
    font-size: var(--text-sm); font-weight: 600;
    background: var(--color-surface-2); border-radius: var(--radius-sm);
    padding: 6px 0;
  }
  .gen-rows { border-top: 1px solid var(--color-line); }
  .gen-row { display: flex; align-items: center; min-height: 50px; }
  .gen-row + .gen-row { border-top: 1px solid var(--color-line); }
  .gen-row .gt { flex: 1; min-width: 0; font-size: var(--text-sm); }
  .gen-row .gt small { display: block; font-size: var(--text-xs); color: var(--color-muted); margin-top: 2px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); }
  .stat { text-align: center; padding: 16px 4px 12px; }
  .stat + .stat { border-left: 1px solid var(--color-line); }
  .stat b { display: block; font-size: var(--text-lg); font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat span { font-size: var(--text-xs); color: var(--color-muted); }
  .stat b.warn { color: var(--color-warning); }
</style>
</head>
<body>

  <header class="statusbar">
    <span>9:41</span>
    <span class="status-icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7.5" width="3" height="4.5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity="0.35"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 4.5a10.5 10.5 0 0 1 14 0"/><path d="M4 7.3a7 7 0 0 1 9 0"/><path d="M6.6 10a3.4 3.4 0 0 1 3.8 0"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" opacity="0.4"/></svg>
    </span>
  </header>

  <main class="page" style="padding-bottom:110px">
    <h1 class="big-title">工具</h1>
    <p class="big-sub">生成、检查、快速录入</p>

    <h2 class="section-label">密码生成器</h2>
    <section class="card gen-card">
      <div class="gen-display">
        <span class="gen-pw" id="pw">kR8#mWv2!pQz4Ln</span>
        <button class="icon-btn" id="regen" aria-label="重新生成">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
        </button>
        <button class="icon-btn" aria-label="复制密码" data-toast="已复制，30 秒后自动清理">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        </button>
      </div>
      <div class="strength">
        <span class="bar"><i id="st-i" style="width:82%"></i></span>
        <span class="txt" id="st-txt">强</span>
      </div>
      <div class="len-row">
        <span class="lbl">长度</span>
        <input class="slider" id="len" type="range" min="8" max="64" value="16" aria-label="密码长度">
        <span class="len-num" id="len-num">16</span>
      </div>
      <div class="gen-rows">
        <div class="gen-row">
          <span class="gt">大写字母</span>
          <label class="switch"><input type="checkbox" id="opt-upper" checked><span class="track"></span></label>
        </div>
        <div class="gen-row">
          <span class="gt">数字</span>
          <label class="switch"><input type="checkbox" id="opt-digit" checked><span class="track"></span></label>
        </div>
        <div class="gen-row">
          <span class="gt">符号</span>
          <label class="switch"><input type="checkbox" id="opt-sym" checked><span class="track"></span></label>
        </div>
        <div class="gen-row">
          <span class="gt">易读模式<small>排除 0/O、1/l 等易混淆字符</small></span>
          <label class="switch"><input type="checkbox" id="opt-readable" checked><span class="track"></span></label>
        </div>
      </div>
    </section>

    <h2 class="section-label">密码健康</h2>
    <section class="card">
      <div class="stats">
        <div class="stat"><b class="warn">3</b><span>弱密码</span></div>
        <div class="stat"><b class="warn">2</b><span>重复密码</span></div>
        <div class="stat"><b>4</b><span>90 天未更新</span></div>
      </div>
      <a class="row" href="detail.html">
        <span class="icon-badge t-card">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
        </span>
        <span class="row-main">
          <span class="row-title">微信支付</span>
          <span class="row-sub">弱密码 · 217 天未更新</span>
        </span>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </a>
      <a class="row" href="detail.html">
        <span class="icon-badge t-login">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
        </span>
        <span class="row-main">
          <span class="row-title">公司 VPN</span>
          <span class="row-sub">与「群晖 NAS」密码重复</span>
        </span>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </a>
    </section>

    <h2 class="section-label">快捷录入</h2>
    <section class="card">
      <a class="row" href="add-entry.html">
        <span class="icon-badge t-primary">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        </span>
        <span class="row-main">
          <span class="row-title">拍照识别银行卡</span>
          <span class="row-sub">对准卡面，自动填入卡号</span>
        </span>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </a>
      <a class="row" href="add-entry.html">
        <span class="icon-badge t-primary">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
        </span>
        <span class="row-main">
          <span class="row-title">扫码添加 TOTP</span>
          <span class="row-sub">扫描二维码，直接生成验证码</span>
        </span>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </a>
    </section>
  </main>

  <nav class="tabbar">
    <a class="tab" href="vault.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
      保险库
    </a>
    <a class="tab" href="vault.html#fav">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11.53 2.3a.53.53 0 0 1 .94 0l2.31 4.67a2.12 2.12 0 0 0 1.6 1.16l5.16.76a.53.53 0 0 1 .3.9l-3.74 3.64a2.12 2.12 0 0 0-.61 1.88l.88 5.14a.53.53 0 0 1-.77.56l-4.62-2.43a2.12 2.12 0 0 0-1.97 0l-4.62 2.43a.53.53 0 0 1-.77-.56l.88-5.14a2.12 2.12 0 0 0-.61-1.88L2.16 9.8a.53.53 0 0 1 .3-.91l5.16-.75a2.12 2.12 0 0 0 1.6-1.16z"/></svg>
      收藏
    </a>
    <a class="tab active" aria-current="page" href="tools.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
      工具
    </a>
    <a class="tab" href="settings.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      设置
    </a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    <span>已完成</span>
  </div>
  <script>
    const toast = document.getElementById('toast');
    const toastMsg = toast.querySelector('span');
    let hideTimer;
    document.querySelectorAll('[data-toast]').forEach(btn =>
      btn.addEventListener('click', () => {
        toastMsg.textContent = btn.dataset.toast;
        toast.classList.add('show');
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => toast.classList.remove('show'), 2000);
      }));

    const sets = {
      upper: 'ABCDEFGHJKLMNPQRSTUVWXYZ',
      lower: 'abcdefghijkmnpqrstuvwxyz',
      digit: '23456789',
      sym: '!@#$%^&*-_+=?'
    };
    const confusing = { upper: 'IO', lower: 'l', digit: '1' };
    const $id = id => document.getElementById(id);

    function gen() {
      const len = +$id('len').value;
      $id('len-num').textContent = len;
      const pool = [];
      const picks = [];
      for (const k of ['upper', 'lower', 'digit', 'sym']) {
        if (k !== 'lower' && !$id('opt-' + k).checked) continue;
        let cs = sets[k];
        if ($id('opt-readable').checked) {
          const bad = confusing[k] || '';
          cs = [...cs].filter(c => !bad.includes(c)).join('');
        }
        pool.push(...cs);
        picks.push(cs[Math.floor(Math.random() * cs.length)]);
      }
      while (picks.length < len) picks.push(pool[Math.floor(Math.random() * pool.length)]);
      for (let i = picks.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [picks[i], picks[j]] = [picks[j], picks[i]];
      }
      $id('pw').textContent = picks.slice(0, len).join('');
      const entropy = Math.round(len * Math.log2(pool.length));
      const score = Math.min(100, Math.round(entropy / 1.4));
      const bar = $id('st-i'), txt = $id('st-txt');
      let label, color;
      if (score < 40)      { label = '弱';   color = 'var(--color-danger)'; }
      else if (score < 70) { label = '一般'; color = 'var(--color-warning)'; }
      else                 { label = '强';   color = 'var(--color-accent)'; }
      bar.style.width = score + '%';
      bar.style.background = color;
      txt.textContent = label + ' · 约 ' + entropy + ' bit';
      txt.style.color = color;
    }
    ['len', 'opt-upper', 'opt-digit', 'opt-sym', 'opt-readable'].forEach(id => {
      const el = $id(id);
      el.addEventListener(el.type === 'range' ? 'input' : 'change', gen);
    });
    $id('regen').addEventListener('click', gen);
    gen();
  </script>

</body>
</html>
