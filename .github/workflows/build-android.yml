name: Build Android

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

# 取消同一分支上正在进行的冗余构建，节省 CI 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.9'
  JAVA_VERSION: '17'

jobs:
  # 代码检查和测试
  analyze-and-test:
    name: 代码分析和测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 运行代码分析
        run: flutter analyze

      - name: 运行测试
        run: flutter test

  # 使用矩阵构建，APK 和 AAB 共享相同的前置步骤
  build-android:
    name: 构建 Android ${{ matrix.target-name }}
    needs: analyze-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    strategy:
      matrix:
        include:
          - target: apk
            target-name: APK（分架构）
            build-command: >
              flutter build apk
              --release
              --split-per-abi
              --build-name=${{ github.ref_name }}
              --build-number=${{ github.run_number }}
            artifact-path: build/app/outputs/flutter-apk/vaultly-*.apk
            artifact-name: android-apk
          - target: aab
            target-name: AAB（App Bundle）
            build-command: >
              flutter build appbundle
              --release
              --build-name=${{ github.ref_name }}
              --build-number=${{ github.run_number }}
            artifact-path: build/app/outputs/bundle/release/vaultly-*.aab
            artifact-name: android-aab

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # 官方 Gradle 缓存方案 — 自动管理 Gradle distribution 和依赖缓存
      # 相比手动 actions/cache，具有更智能的缓存键和失效策略
      - name: 设置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 缓存 Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/cache
            ${{ env.ANDROID_SDK_ROOT }}/build-tools
            ${{ env.ANDROID_SDK_ROOT }}/platforms
            ${{ env.ANDROID_SDK_ROOT }}/platform-tools
            ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('android/app/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # Flutter 依赖缓存命中时跳过网络请求
      - name: 获取依赖（优先离线）
        id: pub-offline
        run: flutter pub get --offline
        continue-on-error: true

      - name: 获取依赖（在线回退）
        if: steps.pub-offline.conclusion != 'success'
        run: flutter pub get

      - name: 配置签名密钥
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > android/app/keystore.jks
          cat > android/key.properties << EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF
          echo "签名配置完成"

      - name: 构建 ${{ matrix.target-name }}
        run: ${{ matrix.build-command }}

      - name: 重命名产物
        run: |
          if [[ "${{ matrix.target }}" == "apk" ]]; then
            cd build/app/outputs/flutter-apk
            mv app-arm64-v8a-release.apk vaultly-${{ github.ref_name }}-android-v8.apk
            mv app-armeabi-v7a-release.apk vaultly-${{ github.ref_name }}-android-v7.apk
          else
            cd build/app/outputs/bundle/release
            mv app-release.aab vaultly-${{ github.ref_name }}-android.aab
          fi
          ls -la

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          retention-days: 30

  # 发布到 GitHub Releases
  release:
    name: 发布到 GitHub Releases
    needs: [build-android]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载所有产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: android-*

      - name: 整理产物文件
        run: |
          mkdir -p release
          find artifacts -name "*.apk" -exec cp {} release/ \;
          find artifacts -name "*.aab" -exec cp {} release/ \;
          ls -la release/

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          body: |
            ## Vaultly ${{ github.ref_name }}

            ### 下载

            **Android APK (ARM 架构):**
            - `vaultly-${{ github.ref_name }}-android-v8.apk` - ARMv8 (ARM64) 设备（推荐，现代 Android 设备）
            - `vaultly-${{ github.ref_name }}-android-v7.apk` - ARMv7 设备（旧设备）

            **Android App Bundle:**
            - `vaultly-${{ github.ref_name }}-android.aab` - Google Play 商店分发格式（包含所有架构）

            ### 安装说明

            1. 根据您的设备架构选择合适的 APK 版本
            2. 下载后在设备上点击安装
            3. 如提示"未知来源"，请在设置中允许安装

            ### 校验

            所有文件均通过 GitHub Actions 自动构建和签名。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 构建状态通知
  notify:
    name: 构建通知
    needs: [build-android]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: 构建成功通知
        if: needs.build-android.result == 'success'
        run: |
          echo "✅ Android 构建成功！"
          echo "版本: ${{ github.ref_name }}"
          echo "提交: ${{ github.sha }}"

      - name: 构建失败通知
        if: needs.build-android.result == 'failure'
        run: |
          echo "❌ Android 构建失败！"
          echo "版本: ${{ github.ref_name }}"
          echo "提交: ${{ github.sha }}"
          exit 1